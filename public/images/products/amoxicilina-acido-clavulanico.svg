<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="100%" height="100%">
  <defs>
    <!-- Soft Box Shadows -->
    <filter id="boxShadow" x="-10%" y="-10%" width="130%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="gradBoxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="gradSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gradDoseBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="capsuleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background Soft Floor Ellipse -->
  <ellipse cx="220" cy="275" rx="160" ry="18" fill="#0f172a" fill-opacity="0.08" filter="blur(8px)" />
  <ellipse cx="215" cy="274" rx="120" ry="10" fill="#0f172a" fill-opacity="0.12" filter="blur(4px)" />

  <g transform="translate(15, 10)">
    <!-- 3D PHARMACEUTICAL CARTON BOX -->
    
    <!-- TOP FLAP (Isometric) -->
    <polygon points="90,70 145,35 345,35 290,70" fill="url(#gradTop)" stroke="#cbd5e1" stroke-width="1" />
    <polygon points="90,70 145,35 195,35 140,70" fill="#2563eb" fill-opacity="0.15" />
    
    <!-- RIGHT SIDE FLAP -->
    <polygon points="290,70 345,35 345,205 290,240" fill="url(#gradSide)" stroke="#94a3b8" stroke-width="1" />
    
    <!-- Side Flap Details -->
    <text x="317" y="120" fill="#475569" font-size="9" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="700" letter-spacing="1" transform="rotate(90, 317, 120)" text-anchor="middle">DISESBA &bull; PHARMA</text>
    <rect x="305" y="160" width="25" height="16" rx="2" fill="#ffffff" fill-opacity="0.6" stroke="#94a3b8" stroke-width="0.5" />
    <!-- Barcode simulation on side -->
    <line x1="309" y1="164" x2="309" y2="172" stroke="#334155" stroke-width="1" />
    <line x1="312" y1="164" x2="312" y2="172" stroke="#334155" stroke-width="1.5" />
    <line x1="315" y1="164" x2="315" y2="172" stroke="#334155" stroke-width="0.75" />
    <line x1="318" y1="164" x2="318" y2="172" stroke="#334155" stroke-width="1.2" />
    <line x1="322" y1="164" x2="322" y2="172" stroke="#334155" stroke-width="2" />
    <line x1="326" y1="164" x2="326" y2="172" stroke="#334155" stroke-width="1" />

    <!-- FRONT FACE (Main) -->
    <polygon points="90,70 290,70 290,240 90,240" fill="url(#gradBoxFront)" stroke="#cbd5e1" stroke-width="1" filter="url(#boxShadow)" />

    <!-- Front Header Colored Banner -->
    <polygon points="90,70 290,70 290,118 90,118" fill="url(#gradHeader)" />
    <!-- Accent Line under Header -->
    <line x1="90" y1="118" x2="290" y2="118" stroke="#93c5fd" stroke-width="3" />

    <!-- Branding Logo on Box -->
    <g transform="translate(100, 78)">
      <rect x="0" y="0" width="60" height="15" rx="7.5" fill="#ffffff" fill-opacity="0.25" />
      <circle cx="8" cy="7.5" r="4.5" fill="#ffffff" />
      <text x="18" y="11" fill="#ffffff" font-size="8.5" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="800" letter-spacing="1">DISESBA</text>
    </g>

    <!-- Category Pill Tag -->
    <g transform="translate(100, 100)">
      <text x="0" y="10" fill="#ffffff" fill-opacity="0.95" font-size="7" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="700" letter-spacing="1.2">ANTIBIÓTICOS</text>
    </g>

    <!-- Product Name on White Front -->
    <text x="100" y="146" fill="#0f172a" font-size="16" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="800" letter-spacing="0.5">AMOXICILINA + ÁCIDO CLAV.</text>

    <!-- Dosage Pill Badge -->
    <g transform="translate(100, 156)">
      <rect x="0" y="0" width="84" height="22" rx="11" fill="url(#gradDoseBadge)" />
      <text x="42" y="15" fill="#ffffff" font-size="11" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="800" text-anchor="middle">875 mg + 125 mg</text>
    </g>

    <!-- Form & Specifications -->
    <text x="100" y="194" fill="#334155" font-size="8.5" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="600">21 Tabletas Recubiertas</text>

    <!-- Badge Tag in Box Footer -->
    <g transform="translate(100, 204)">
      <rect x="0" y="0" width="95" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.75" />
      <circle cx="8" cy="8" r="2.5" fill="#2563eb" />
      <text x="16" y="11.5" fill="#2563eb" font-size="7" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="700">21 Tabletas</text>
    </g>

    <!-- Quality Rx Hologram / Seal -->
    <g transform="translate(236, 178)">
      <circle cx="20" cy="20" r="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="20" cy="20" r="15" fill="none" stroke="#2563eb" stroke-dasharray="2 2" stroke-width="1" />
      <!-- Medical Cross or Seal -->
      <path d="M18 12 H22 V18 H28 V22 H22 V28 H18 V22 H12 V18 H18 Z" fill="#2563eb" />
      <text x="20" y="34" fill="#64748b" font-size="4.5" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="700" text-anchor="middle">CALIDAD</text>
    </g>

    <!-- BLISTER PACK / CAPSULES GRAPHIC (Front Foreground Element) -->
    <g transform="translate(48, 140)">
      <!-- Blister Foil Plate -->
      <rect x="0" y="0" width="70" height="95" rx="6" fill="url(#foilGrad)" stroke="#cbd5e1" stroke-width="1" filter="url(#boxShadow)" />
      
      <!-- Blister Pockets (Pills or Capsules) -->
      <!-- Row 1 -->
      <rect x="8" y="12" width="22" height="12" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
      <rect x="8" y="12" width="11" height="12" rx="6" fill="#2563eb" />
      <rect x="40" y="12" width="22" height="12" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
      <rect x="40" y="12" width="11" height="12" rx="6" fill="#2563eb" />
      
      <!-- Row 2 -->
      <rect x="8" y="38" width="22" height="12" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
      <rect x="8" y="38" width="11" height="12" rx="6" fill="#2563eb" />
      <rect x="40" y="38" width="22" height="12" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
      <rect x="40" y="38" width="11" height="12" rx="6" fill="#2563eb" />

      <!-- Row 3 -->
      <rect x="8" y="64" width="22" height="12" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
      <rect x="8" y="64" width="11" height="12" rx="6" fill="#2563eb" />
      <rect x="40" y="64" width="22" height="12" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
      <rect x="40" y="64" width="11" height="12" rx="6" fill="#2563eb" />

      <line x1="35" y1="5" x2="35" y2="90" stroke="#94a3b8" stroke-dasharray="2 2" stroke-width="0.8" />
    </g>
  </g>
</svg>